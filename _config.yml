# ============================================
# Dastan Jasim — Academic Website Configuration
# Based on AcademicPages (Minimal Mistakes theme)
# ============================================

locale                   : "en-US"
site_theme               : "default"
title                    : "Dastan Jasim"
title_separator          : "-"
name                     : &name "Dastan Jasim"
description              : &description "Political Scientist – Democratization, Kurdish Studies, Middle East Politics"
url                      : "https://dastan-jasim.github.io"
baseurl                  : ""
repository               : "dastan-jasim/dastan-jasim.github.io"

# --------------------------------------------
# Author Sidebar Profile
# --------------------------------------------
author:
  avatar : "images/dastan-jasim.jpg"
  name             : "Dastan Jasim, PhD"
  pronouns         : "she/her"
  bio              : "Political Scientist specializing in Democratization, Migration, and Kurdish Studies. Research Engineer & Senior Data Scientist at Paris Dauphine University – ACSS-DIG."
  location         : "Paris, France"
  employer: >
    Université Paris-Dauphine (PSL)<br>
    GIGA Hamburg
  uri              : 
  email            : "jasim.dastan@gmail.com"

  # Academic profiles
  googlescholar    : "https://scholar.google.com/citations?user=v39m9p4AAAAJ&hl=en"
  orcid            : "https://orcid.org/0000-0002-4158-276X"
  researchgate     : 
  linkedin         : "https://www.linkedin.com/in/dastan-jasim-50a598263/"
  academia         : 
  arxiv            : 
  scopus           : 
  pubmed           : 

  # Developer / data science profiles
  github           : "dastan-jasim"
  kaggle           : 
  stackoverflow    : 

  # Social
  twitter          : 
  bluesky          : 
  mastodon         : 
  instagram        : 
  facebook         : 
  youtube          : 
  wikipedia        : 

# --------------------------------------------
# Publication Categories
# --------------------------------------------
publication_category:
  peer-reviewed:
    title: "Peer-Reviewed Articles"
  book-chapter:
    title: "Book Chapters"
  policy-paper:
    title: "Policy Papers"
  book-review:
    title: "Book Reviews"
  book:
    title: "Books"

# --------------------------------------------
# Site Settings
# --------------------------------------------
teaser                   : 
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               : false

atom_feed:
  hide                   : false

# --------------------------------------------
# SEO and Analytics
# --------------------------------------------
google_site_verification :
analytics:
  provider               : false

# --------------------------------------------
# Reading & Output Settings
# --------------------------------------------
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .github
  - node_modules
  - vendor
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# --------------------------------------------
# Markdown Conversion
# --------------------------------------------
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  auto_ids: true
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# --------------------------------------------
# Collections
# --------------------------------------------
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# --------------------------------------------
# Defaults
# --------------------------------------------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true

# --------------------------------------------
# Sass and Output
# --------------------------------------------
sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Europe/Paris

# --------------------------------------------
# Plugins
# --------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# --------------------------------------------
# Archives
# --------------------------------------------
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# --------------------------------------------
# HTML Compression
# --------------------------------------------
compress_html:
  clippings: all
  ignore:
    envs: development

<div class="lang-switch">
  <a href="/"        {% if page.lang == 'en' or page.lang == nil %}class="active"{% endif %}>EN</a>
  <a href="/de/"     {% if page.lang == 'de' %}class="active"{% endif %}>DE</a>
  <a href="/fr/"     {% if page.lang == 'fr' %}class="active"{% endif %}>FR</a>
  <a href="/ku/"     {% if page.lang == 'ku' %}class="active"{% endif %}>KU</a>
  <a href="/so/"     {% if page.lang == 'so' %}class="active"{% endif %}>SO</a>
</div>
